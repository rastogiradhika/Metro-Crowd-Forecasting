databases:
  - name: metroai-db
    plan: free

services:
  - type: web
    name: metroai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    rootDir: metroai-backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: metroai-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://metroai.vercel.app"
      - key: ADMIN_EMAIL
        value: admin@delhimetrorail.com
      - key: ADMIN_PASSWORD
        generateValue: true
